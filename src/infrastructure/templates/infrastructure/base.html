{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'infrastructure/site.css' %}" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom mb-4">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{% url 'home' %}">AA Test Site</a>
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link {% if page_key == 'docs' %}active{% endif %}" href="{% url 'docs' %}">Documentation</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if page_key == 'api' %}active{% endif %}" href="{% url 'api' %}">API</a>
        </li>
      </ul>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'admin:index' %}">Admin</a>
        </li>
      </ul>
    </div>
  </nav>

  <main class="container mb-4">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-top py-3">
    <div class="container text-muted">This is a toy site</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
