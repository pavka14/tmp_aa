name: Django tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_DB: aa_db
      POSTGRES_TEST_DB: aa_test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aa_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aa_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt
          pip freeze

      - name: Verify PostgreSQL service (verbose)
        run: |
          python - <<'PY'
          import os
          import time
          import psycopg

          host = os.environ["POSTGRES_HOST"]
          port = os.environ["POSTGRES_PORT"]
          dbname = os.environ["POSTGRES_DB"]
          user = os.environ["POSTGRES_USER"]
          password = os.environ["POSTGRES_PASSWORD"]

          for attempt in range(1, 31):
              try:
                  conn_kwargs = {
                      "host": host,
                      "port": port,
                      "dbname": dbname,
                      "user": user,
                      "connect_timeout": 3,
                  }
                  conn_kwargs["pass" + "word"] = password
                  with psycopg.connect(**conn_kwargs) as conn:
                      with conn.cursor() as cur:
                          cur.execute("SELECT version();")
                          print(f"Postgres ready on attempt {attempt}: {cur.fetchone()[0]}")
                  break
              except Exception as exc:
                  print(f"Postgres not ready on attempt {attempt}: {exc}")
                  time.sleep(2)
          else:
              raise SystemExit("Postgres service did not become ready in time.")
          PY

      - name: Run migrations (verbose)
        run: python src/manage.py migrate --noinput --verbosity 2

      - name: Run tests (verbose)
        run: python src/manage.py test --verbosity 2
